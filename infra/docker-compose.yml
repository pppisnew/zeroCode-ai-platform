services:
  mysql:
    image: mysql:8.4
    container_name: zerocode-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zerocode
      MYSQL_USER: zerocode
      MYSQL_PASSWORD: zerocode
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: zerocode-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: zerocode-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: zerocode
      RABBITMQ_DEFAULT_PASS: zerocode
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: zerocode-minio
    environment:
      MINIO_ROOT_USER: zerocode
      MINIO_ROOT_PASSWORD: zerocode123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
